[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicopr"
version = "0.9.0"
description = "A Python port of the IEEE 802.3 COM (Channel Operating Margin) reference code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Todd Bermensolo" }]
keywords = ["IEEE802.3", "COM", "channel-operating-margin", "signal-integrity",
            "serdes", "touchstone"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

# Kept deliberately small. The engine is one assembled module over the
# scientific stack; anything beyond this is for reporting, not for computing a
# COM value.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
report = ["python-pptx>=0.6.21", "python-docx>=1.1"]
dev = ["matplotlib>=3.7", "python-pptx>=0.6.21", "python-docx>=1.1", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tbermen/SiCoPR"
Source = "https://github.com/tbermen/SiCoPR"

# No [project.scripts]. The command-line interface lives in sicopr.py's
# `if __name__ == '__main__'` block, so there is no importable entry function
# for an executable to call. Run the engine as `python -m sicopr`. An earlier
# `sicopr = "sicopr:main"` here installed a sicopr.exe that failed on every
# invocation with ImportError.

# sicopr.py is a single assembled module, generated by assemble_sicopr.py from
# the per-function sources in com_functions/fn/<name>/py_impl.py. It is checked
# in so the engine runs with no build step and no MATLAB, which is the point of
# the port. com_functions ships alongside it because each function sits next to
# the MATLAB it was translated from, and that pairing is the audit trail.
[tool.setuptools]
py-modules = ["sicopr", "com_mat_export", "com_plots"]

[tool.setuptools.packages.find]
include = ["com_functions*", "gui*"]

[tool.setuptools.package-data]
"com_functions" = ["fn/*/*.py", "fn/*/*.m", "fn/*/*.md"]
"gui" = ["static/*"]

# The suite is driven by tests/run_all.ps1, not by bare pytest: several modules
# are plain assert-based scripts with their own __main__ block, and `pytest
# tests` collects almost nothing and exits 0, which looks like success.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
