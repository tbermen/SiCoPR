name: CI

# The point of this workflow is the thing that is easy to get wrong by hand:
# a runner is a FRESH CLONE with no correlation data, which is exactly the state
# a first-time visitor is in. That state was broken once already -- the suite
# exited 1 because a test treated absent config workbooks as a failure rather
# than as the normal case -- and nothing would have caught it except cloning the
# repo and running it, which is what this does on every push.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Suite on a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: sicopr.py must match its sources
        # sicopr.py is generated. If a contributor edited it directly, or edited a
        # py_impl.py and forgot to re-assemble, the committed engine and its
        # sources disagree -- and every test here would run the wrong one.
        run: |
          cp sicopr.py /tmp/sicopr_committed.py
          cp com_functions/inlined_copies.json /tmp/manifest_committed.json
          python assemble_sicopr.py
          if ! diff -q /tmp/sicopr_committed.py sicopr.py > /dev/null; then
            echo "::error::sicopr.py does not match com_functions/fn/*/py_impl.py."
            echo "Run 'python assemble_sicopr.py' and commit the result."
            diff /tmp/sicopr_committed.py sicopr.py | head -40
            exit 1
          fi
          echo "sicopr.py is in sync with its sources"
          # The provenance manifest is generated by the same run. Diff it here
          # too: the assembler runs before the test suite, so a stale committed
          # manifest would otherwise be silently overwritten and never noticed.
          if ! diff -q /tmp/manifest_committed.json com_functions/inlined_copies.json > /dev/null; then
            echo "::error::com_functions/inlined_copies.json is stale."
            echo "Run 'python assemble_sicopr.py' and commit the result."
            diff /tmp/manifest_committed.json com_functions/inlined_copies.json | head -40
            exit 1
          fi
          echo "inlined_copies.json is in sync with the engine"

      - name: Per-function unit tests
        run: python -m pytest com_functions/fn -q --tb=short

      - name: Interface checks
        run: python dev/check_interfaces.py

      - name: Pytest modules under tests/
        # NOT `pytest tests/` -- most files there are standalone audit scripts
        # whose module-level sys.exit makes pytest report "no tests ran" and exit
        # 0. Naming them explicitly is what makes this step mean anything.
        run: |
          python -m pytest tests/test_smoke.py -q
          python -m pytest tests/test_checkpoints.py -q
          python -m pytest tests/test_end_to_end.py -q
          python -m pytest tests/test_export_columns.py -q

      - name: Audit scripts
        # Each is run directly and must exit 0. A script that skips for want of
        # correlation data must SKIP, not fail: that is the fresh-clone contract.
        run: |
          fail=0
          for f in tests/test_*.py; do
            case "$(basename "$f")" in
              test_smoke.py|test_checkpoints.py|test_end_to_end.py|test_export_columns.py)
                continue ;;
            esac
            echo "--- $f"
            if ! python "$f"; then
              echo "::error file=$f::audit script failed on a clean checkout"
              fail=1
            fi
          done
          exit $fail

  licence:
    name: Licence notice is intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: BSD-3-Clause attribution must survive
        # Clause 1 requires the notice to travel with redistributed source, and
        # sicopr.py is the file most users actually receive. It is generated, so the
        # notice can silently vanish if the header template is edited.
        run: |
          test -f LICENSE || { echo "::error::LICENSE is missing"; exit 1; }
          for pat in "802-COM Authors" "SPDX-License-Identifier: BSD-3-Clause"; do
            grep -q "$pat" LICENSE || { echo "::error::LICENSE lost: $pat"; exit 1; }
            grep -q "$pat" sicopr.py  || { echo "::error::sicopr.py header lost: $pat"; exit 1; }
          done
          echo "licence notice present in LICENSE and in sicopr.py"

      - name: NOTICE checksums must match the upstream files
        # NOTICE records a SHA-256 for each MATLAB reference file so that a
        # reader can tell exactly which upstream build this port derives from.
        # A checksum nobody verifies is worth nothing -- if someone swaps in a
        # newer reference and forgets to update NOTICE, the provenance claim
        # becomes false silently.
        run: |
          python - <<'EOF'
          import hashlib, io, os, re, sys
          cur, bad, ok = None, [], 0
          for line in io.open('NOTICE', encoding='utf-8'):
              s = line.strip()
              m = re.match(r'^(matlab/\S+\.m)$', s)
              if m:
                  cur = m.group(1)
                  continue
              m = re.match(r'^sha256\s+([0-9a-f]{64})$', s)
              if m and cur:
                  if not os.path.exists(cur):
                      bad.append('%s: recorded in NOTICE but not in the repo' % cur)
                  else:
                      got = hashlib.sha256(io.open(cur, 'rb').read()).hexdigest()
                      if got == m.group(1):
                          ok += 1
                      else:
                          bad.append('%s: NOTICE says %s, file is %s'
                                     % (cur, m.group(1), got))
                  cur = None
          if not ok and not bad:
              sys.exit('::error::no sha256 entries found in NOTICE')
          for b in bad:
              print('::error::%s' % b)
          if bad:
              sys.exit(1)
          print('%d upstream checksum(s) verified against NOTICE' % ok)
          EOF

  hygiene:
    name: No correlation data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject re-added inputs and stray large files
        # Inputs and outputs are not distributed with this repository. Committing
        # one would put hundreds of MB into every clone and redistribute material
        # that is not ours to redistribute.
        run: |
          # examples/ is the exception, and only for the workbook. A COM
          # configuration workbook carries a License Notice sheet placing it
          # under the same BSD-3-Clause licence as the reference code, so it may
          # be redistributed; the worked example ships one. Channels never ship
          # under any path: '*.s4p' below has no exception, and the example
          # names its channel files and checksums them instead of carrying them.
          bad=$(git ls-files \
            'tests/0_IEEE_802p3dj_PublicArea_CR_KR_Channels/*' \
            'tests/1_IEEE_802p3dj_COM_Spreadsheets*/*' \
            'tests/2_Results_COM_Matlab/*' \
            'tests/ALS_test_configs/*' \
            'dev/prompts/*' \
            '*.s4p' 'config*.xlsx' | grep -v '^examples/' || true)
          # Reference VALUES, not just the workbooks they came from: a distillation
          # of the reference numbers is the reference data too, and is excluded on
          # the same grounds.
          derived=$(git ls-files 'tests/oracles/*' 'report_data/*' || true)
          if [ -n "$derived" ]; then
            echo "::error::MATLAB-derived reference values must not be committed:"
            echo "$derived"
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::correlation inputs must not be committed:"
            echo "$bad"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null \
                | awk '$1 > 5120 {print $1" KB\t"$2}' || true)
          if [ -n "$big" ]; then
            echo "::warning::files larger than 5 MB are tracked:"
            echo "$big"
          fi
          echo "no correlation inputs tracked"

  dco:
    name: Commits are signed off
    # BSD-3-Clause has no inbound-contribution clause, so a Signed-off-by line
    # is the only record that a contributor agreed to the licence their code is
    # distributed under. Pull requests only: master's own history predates this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit in this PR needs Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::missing Signed-off-by: $sha $(git log -1 --format='%s' "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "Add one with 'git commit -s', or 'git rebase --signoff $base' for a series."
            echo "See CONTRIBUTING.md -> Licensing -> Sign your commits off (DCO)."
            exit 1
          fi
          echo "all commits signed off"
